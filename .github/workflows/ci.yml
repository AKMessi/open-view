name: OpenView CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Rust + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Bootstrap & Build Rust/WASM
        run: npm run bootstrap:wasm && npm run build:wasm

      - name: Rust Unit Tests (TA, Backtester, Pine v5/v6 VM)
        run: npm run test:rust

      - name: TypeScript Typecheck (All Workspaces)
        run: npm run typecheck

      - name: Vitest Suite (Security, Chart Core, Datafeeds, Drawings, Replay, Broker, Chart Types, Alerts & Screener)
        run: npm run test

      - name: Production Web Build & Initial Bundle Size Check (< 200 KB gzip)
        run: npm --workspace @openview/web run build
